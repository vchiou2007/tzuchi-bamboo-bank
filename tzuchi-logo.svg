<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="300" height="340">
  <!-- ===== 透明背景（無任何底色） ===== -->
  
  <!-- ===== 裝飾葉片（左側 + 右側） ===== -->
  <g fill="#2D8B2D" opacity="0.85">
    <!-- 左上葉片 -->
    <path d="M32 110 Q10 90 20 60 Q32 65 38 82 Q40 90 42 100 Q38 100 32 110Z"/>
    <path d="M22 132 Q2 118 8 88 Q18 94 24 110 Q28 120 30 128 Q26 128 22 132Z"/>
    <!-- 左下葉片 -->
    <path d="M34 210 Q12 218 14 248 Q26 238 32 222 Q36 214 40 206 Q36 208 34 210Z"/>
    <path d="M24 196 Q6 200 4 230 Q16 220 22 206 Q26 198 28 192 Q24 194 24 196Z"/>
    <!-- 右上葉片 -->
    <path d="M268 110 Q290 90 280 60 Q268 65 262 82 Q260 90 258 100 Q262 100 268 110Z"/>
    <path d="M278 132 Q298 118 292 88 Q282 94 276 110 Q272 120 270 128 Q274 128 278 132Z"/>
    <!-- 右下葉片 -->
    <path d="M266 210 Q288 218 286 248 Q274 238 268 222 Q264 214 260 206 Q264 208 266 210Z"/>
    <path d="M276 196 Q294 200 296 230 Q284 220 278 206 Q274 198 272 192 Q276 194 276 196Z"/>
  </g>

  <!-- ===== 中央盾牌 ===== -->
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A9E3A"/>
      <stop offset="50%" stop-color="#2D8B2D"/>
      <stop offset="100%" stop-color="#1E6E1E"/>
    </linearGradient>
    <linearGradient id="shieldHighlight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
    </linearGradient>
  </defs>

  <!-- 盾牌外框 -->
  <path d="M150 32 
           Q240 32 258 60 
           Q275 88 278 120
           Q282 168 260 210
           Q238 250 200 278
           Q175 295 150 308
           Q125 295 100 278
           Q62 250 40 210
           Q18 168 22 120
           Q25 88 42 60
           Q60 32 150 32Z" 
        fill="url(#shieldGrad)" 
        stroke="#1A5E1A" 
        stroke-width="2"/>

  <!-- 盾牌光澤 -->
  <path d="M150 38 
           Q232 38 248 62 
           Q262 86 266 116
           Q270 158 252 196
           Q232 232 198 262
           Q175 278 150 292
           Q125 278 102 262
           Q68 232 48 196
           Q30 158 34 116
           Q38 86 52 62
           Q68 38 150 38Z" 
        fill="url(#shieldHighlight)"/>

  <!-- ===== 帆船 ===== -->
  <g transform="translate(150, 170)">
    <!-- 波浪 -->
    <path d="M-50 22 Q-30 10 -10 22 Q10 34 30 22 Q50 10 60 22 
             L60 36 Q50 24 30 36 Q10 48 -10 36 Q-30 24 -50 36Z" 
          fill="white" opacity="0.85"/>
    <path d="M-45 16 Q-25 4 -5 16 Q15 28 35 16 Q50 4 58 16 
             L58 24 Q50 12 35 24 Q15 36 -5 24 Q-25 12 -45 24Z" 
          fill="white" opacity="0.7"/>
    
    <!-- 船身 -->
    <path d="M-28 20 L-35 30 L35 30 L28 20Z" fill="white"/>
    
    <!-- 主帆 -->
    <path d="M-5 20 L-5 -28 L22 -2 L-5 8Z" fill="white" opacity="0.9"/>
    
    <!-- 前帆 -->
    <path d="M2 20 L2 -12 L22 -2 L2 8Z" fill="white" opacity="0.7"/>
    
    <!-- 桅杆 -->
    <line x1="-3" y1="20" x2="-3" y2="-32" stroke="white" stroke-width="2" opacity="0.6"/>
    
    <!-- 旗幟 -->
    <path d="M-3 -32 L12 -28 L-3 -24Z" fill="white" opacity="0.8"/>
  </g>

  <!-- ===== 慈（左側） ===== -->
  <text x="72" y="170" text-anchor="middle" font-family="'Noto Sans TC','KaiTi','STKaiti','SimSun','MingLiU',serif" 
        font-size="38" font-weight="700" fill="white" opacity="0.95">慈</text>

  <!-- ===== 濟（右側） ===== -->
  <text x="228" y="170" text-anchor="middle" font-family="'Noto Sans TC','KaiTi','STKaiti','SimSun','MingLiU',serif" 
        font-size="38" font-weight="700" fill="white" opacity="0.95">濟</text>

  <!-- ===== 盾牌下方小裝飾 ===== -->
  <path d="M130 292 Q140 298 150 296 Q160 298 170 292" 
        fill="none" stroke="#2D8B2D" stroke-width="1.5" opacity="0.5"/>
</svg>
