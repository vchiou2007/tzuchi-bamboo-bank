<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="340" height="280">
  <!-- 透明背景 / Transparent background -->

  <!-- 漸層定義 / Gradients -->
  <defs>
    <!-- 盾牌綠色漸層 -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3DA83D"/>
      <stop offset="45%" stop-color="#2D8B2D"/>
      <stop offset="100%" stop-color="#1A6E1A"/>
    </linearGradient>
    <!-- 盾牌高光 -->
    <linearGradient id="shieldHL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.02)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.1)"/>
    </linearGradient>
  </defs>

  <!-- ===== 裝飾葉片 (左右各3片) ===== -->
  <g fill="#2D8B2D" opacity="0.8">
    <!-- 左上葉 -->
    <path d="M48 78 Q22 58 28 42 Q40 46 46 58 Q50 66 52 74 Q48 76 48 78Z"/>
    <path d="M36 96 Q14 86 16 68 Q26 72 32 84 Q36 92 38 96 Q34 96 36 96Z"/>
    <path d="M26 118 Q8 114 8 100 Q16 102 22 110 Q26 116 28 118 Q24 118 26 118Z"/>
    <!-- 右上葉 -->
    <path d="M292 78 Q318 58 312 42 Q300 46 294 58 Q290 66 288 74 Q292 76 292 78Z"/>
    <path d="M304 96 Q326 86 324 68 Q314 72 308 84 Q304 92 302 96 Q306 96 304 96Z"/>
    <path d="M314 118 Q332 114 332 100 Q324 102 318 110 Q314 116 312 118 Q316 118 314 118Z"/>
    <!-- 左下葉 -->
    <path d="M44 182 Q22 190 24 202 Q34 196 40 188 Q44 182 44 182Z"/>
    <path d="M32 196 Q14 198 14 212 Q24 206 30 196Q32 194 32 196Z"/>
    <path d="M24 210 Q8 210 10 224 Q16 216 22 210Q24 208 24 210Z"/>
    <!-- 右下葉 -->
    <path d="M296 182 Q318 190 316 202 Q306 196 300 188 Q296 182 296 182Z"/>
    <path d="M308 196 Q326 198 326 212 Q316 206 310 196Q308 194 308 196Z"/>
    <path d="M316 210 Q332 210 330 224 Q324 216 318 210Q316 208 316 210Z"/>
  </g>

  <!-- ===== 盾牌主體 ===== -->
  <!-- 圓潤頂部 + 尖形底部 -->
  <path d="M170 28 
           Q240 28 260 52 
           Q284 78 286 110
           Q290 150 272 190
           Q254 224 226 244
           Q200 258 170 260
           Q140 258 114 244
           Q86 224 68 190
           Q50 150 54 110
           Q56 78 80 52
           Q100 28 170 28Z" 
        fill="url(#shieldGrad)" 
        stroke="#1A5E1A" 
        stroke-width="1.5"/>

  <!-- 盾牌高光 -->
  <path d="M170 34 
           Q234 34 250 54 
           Q272 76 274 108
           Q278 146 260 184
           Q244 214 218 236
           Q196 248 170 250
           Q144 248 122 236
           Q96 214 80 184
           Q62 146 66 108
           Q68 76 90 54
           Q106 34 170 34Z" 
        fill="url(#shieldHL)"/>

  <!-- ===== 帆船 ===== -->
  <g transform="translate(170, 142)">
    <!-- 下層波浪 -->
    <path d="M-42 16 Q-22 4 -2 16 Q18 28 38 16 Q52 6 56 16 
             L56 28 Q52 18 38 28 Q18 40 -2 28 Q-22 16 -42 28Z" 
          fill="white" opacity="0.8"/>
    <!-- 上層波浪 -->
    <path d="M-36 8 Q-16 -2 4 8 Q24 20 44 8 Q52 2 54 8 
             L54 18 Q52 10 44 18 Q24 30 4 18 Q-16 6 -36 18Z" 
          fill="white" opacity="0.7"/>
    <!-- 船身 -->
    <path d="M-26 12 L-30 22 L30 22 L26 12Z" fill="white"/>
    <!-- 主帆 -->
    <path d="M-4 12 L-4 -24 L20 0 L-4 6Z" fill="white" opacity="0.9"/>
    <!-- 前帆 -->
    <path d="M4 12 L4 -10 L20 0 L4 6Z" fill="white" opacity="0.65"/>
    <!-- 桅杆 -->
    <line x1="-2" y1="12" x2="-2" y2="-28" stroke="white" stroke-width="1.8" opacity="0.6"/>
    <!-- 旗 -->
    <path d="M-2 -28 L10 -24 L-2 -20Z" fill="white" opacity="0.75"/>
  </g>

  <!-- ===== 慈 (左) ===== -->
  <text x="86" y="148" text-anchor="middle" 
        font-family="'Noto Sans TC','KaiTi','STKaiti','SimSun','MingLiU',serif" 
        font-size="34" font-weight="700" fill="white" opacity="0.95">慈</text>

  <!-- ===== 濟 (右) ===== -->
  <text x="254" y="148" text-anchor="middle" 
        font-family="'Noto Sans TC','KaiTi','STKaiti','SimSun','MingLiU',serif" 
        font-size="34" font-weight="700" fill="white" opacity="0.95">濟</text>

  <!-- 盾牌底部裝飾線 -->
  <path d="M148 248 Q158 252 170 250 Q182 252 192 248" 
        fill="none" stroke="#2D8B2D" stroke-width="1.5" opacity="0.4"/>
</svg>
