<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>竹筒歲月 — 每日一善</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    /* ===== Google Fonts ===== */
    /* ===== 全域重設 ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100vh;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #F5F0E8;
      color: #3A2E20;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* ===== App Container ===== */
    #app {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px 30px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* ===== Header ===== */
    .header {
      width: 100%;
      text-align: center;
      padding: 12px 0 6px;
      position: relative;
    }
    .header .greeting {
      font-size: 15px;
      color: #8B7355;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .header .date-display {
      font-size: 12px;
      color: #A09070;
      letter-spacing: 0.5px;
    }
    .header .tzuchi-logo {
      width: 220px; height: auto;
      margin: 0 auto 4px;
      display: block;
      border-radius: 4px;
      filter: brightness(0.5) saturate(1.5) contrast(1.2);
    }
    .header .org-name {
      font-size: 16px;
      color: #5A4E3A;
      letter-spacing: 3px;
      font-weight: 500;
      margin-bottom: 6px;
    }
    /* ===== Jing Si Aphorism Card ===== */
    .aphorism-card {
      width: 100%;
      background: linear-gradient(135deg, #FFFFFF 0%, #FCF8F0 100%);
      border-radius: 16px;
      padding: 20px 18px;
      margin: 12px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid rgba(196, 176, 140, 0.2);
      position: relative;
      text-align: center;
    }
    .aphorism-card .label {
      font-size: 11px;
      color: #C8974A;
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .aphorism-card .quote {
      font-size: 17px;
      line-height: 1.7;
      color: #3A2E20;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .aphorism-card .author {
      font-size: 12px;
      color: #A09070;
      margin-top: 10px;
      letter-spacing: 1px;
    }
    .aphorism-card .divider {
      width: 40px; height: 2px;
      background: #D4A76A;
      margin: 10px auto 12px;
      border-radius: 2px;
      opacity: 0.5;
    }
    /* ===== Daily Mission ===== */
    .mission-section {
      width: 100%;
      margin: 8px 0;
    }
    .mission-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(196, 176, 140, 0.12);
    }
    .mission-row .icon {
      font-size: 22px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #9BC53D, #7FA832);
      border-radius: 50%;
      flex-shrink: 0;
      color: white;
      font-size: 16px;
    }
    .mission-row .icon.heart { background: linear-gradient(135deg, #E88D67, #D4754F); }
    .mission-row .icon.lotus { background: linear-gradient(135deg, #C8974A, #B8863A); }
    .mission-row .text {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      color: #3A2E20;
    }
    .mission-row .text .label {
      font-size: 10px;
      color: #A09070;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 2px;
    }
    /* ===== Bamboo Bank ===== */
    .bamboo-section {
      width: 100%;
      text-align: center;
      margin: 16px 0 8px;
      position: relative;
    }
    .bamboo-section .title {
      font-size: 13px;
      color: #8B7355;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .bamboo-container {
      position: relative;
      width: 200px;
      height: 280px;
      margin: 0 auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .bamboo-container:active {
      transform: scale(0.97);
      transition: transform 0.1s;
    }
    /* ===== Bamboo SVG ===== */
    .bamboo-svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.12));
    }
    /* ===== Coin Drop Animation ===== */
    .coin-fly {
      position: fixed;
      width: 36px; height: 36px;
      pointer-events: none;
      z-index: 100;
      font-size: 30px;
      line-height: 36px;
      text-align: center;
      animation: coinDrop 4.0s ease-in forwards;
    }
    @keyframes coinDrop {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      60% { opacity: 1; transform: translateY(60px) scale(1.1) rotate(360deg); }
      100% { opacity: 0; transform: translateY(90px) scale(0.6) rotate(720deg); }
    }
    /* ===== Clink Ripple ===== */
    .ripple {
      position: absolute;
      top: 55%; left: 50%;
      width: 60px; height: 30px;
      margin-left: -30px; margin-top: -15px;
      border-radius: 50%;
      border: 2px solid #C8974A;
      opacity: 0;
      pointer-events: none;
      animation: rippleAnim 3.0s ease-out forwards;
    }
    @keyframes rippleAnim {
      0% { transform: scale(0.3); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }
    /* ===== Total Display ===== */
    .total-display {
      margin: 8px 0 4px;
      text-align: center;
    }
    .total-display .amount {
      font-size: 36px;
      font-weight: 700;
      color: #3A2E20;
      letter-spacing: 1px;
      line-height: 1.2;
    }
    .total-display .amount .unit {
      font-size: 16px;
      font-weight: 400;
      color: #8B7355;
      margin-left: 2px;
    }
    .total-display .sub {
      font-size: 12px;
      color: #A09070;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    /* ===== Stats ===== */
    .stats-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    .stat-card {
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid rgba(196, 176, 140, 0.12);
    }
    .stat-card .num {
      font-size: 22px;
      font-weight: 600;
      color: #3A2E20;
    }
    .stat-card .lbl {
      font-size: 10px;
      color: #A09070;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    /* ===== Drop Button ===== */
    .drop-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #9BC53D 0%, #7FA832 100%);
      color: white;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 12px rgba(155, 197, 61, 0.3);
    }
    .drop-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(155, 197, 61, 0.2);
    }
    .drop-btn:disabled {
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }
    /* ===== Reset Button ===== */
    .reset-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid rgba(196, 176, 140, 0.3);
      border-radius: 12px;
      background: rgba(255,255,255,0.5);
      color: #8B7355;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      margin-top: 8px;
      touch-action: manipulation;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.8); color: #3A2E20; }
    .reset-btn:active { transform: scale(0.97); }
    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      max-width: 300px;
      width: 90%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      animation: modalIn 0.3s ease-out;
    }
    @keyframes modalIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-icon { font-size: 48px; margin-bottom: 8px; }
    .modal-title { font-size: 18px; font-weight: 600; color: #3A2E20; margin-bottom: 8px; }
    .modal-text { font-size: 13px; color: #8B7355; line-height: 1.6; margin-bottom: 20px; }
    .modal-btns { display: flex; gap: 10px; }
    .modal-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .modal-btn.cancel {
      background: #F0ECE4;
      color: #8B7355;
    }
    .modal-btn.cancel:hover { background: #E8E0D4; }
    .modal-btn.confirm {
      background: linear-gradient(135deg, #D44A4A, #B83030);
      color: white;
    }
    .modal-btn.confirm:hover { background: linear-gradient(135deg, #C44040, #A82828); }
    /* ===== History ===== */
    .history-section {
      width: 100%;
      margin-top: 16px;
    }
    .history-section .toggle-btn {
      width: 100%;
      background: none;
      border: none;
      font-size: 13px;
      color: #8B7355;
      cursor: pointer;
      padding: 8px;
      letter-spacing: 1px;
      font-family: inherit;
    }
    .history-section .toggle-btn:hover { color: #3A2E20; }
    .history-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .history-list.open { max-height: 400px; overflow-y: auto; }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(196, 176, 140, 0.1);
      font-size: 13px;
      color: #5A4E3A;
    }
    .history-item .date { color: #A09070; }
    .history-item .count { font-weight: 500; }
    /* ===== Sparkle effect ===== */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      animation: sparkleAnim 4.0s ease-out forwards;
    }
    @keyframes sparkleAnim {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
    /* ===== Applause overlay ===== */
    .applause-overlay {
      position: fixed;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .applause-overlay.show { opacity: 1; }
    .applause-overlay .hands {
      font-size: 60px;
      animation: clapAnim 2.5s ease-in-out infinite alternate;
    }
    @keyframes clapAnim {
      0% { transform: scale(1) rotate(-15deg); }
      50% { transform: scale(1.3) rotate(15deg); }
      100% { transform: scale(1) rotate(-15deg); }
    }
    .applause-overlay .text {
      font-size: 20px;
      color: #9BC53D;
      font-weight: 500;
      letter-spacing: 3px;
      margin-top: 12px;
      text-shadow: 0 2px 8px rgba(155, 197, 61, 0.3);
      animation: textPop 2.5s ease-out;
    }
    @keyframes textPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .applause-overlay .sub-text {
      font-size: 13px;
      color: #A09070;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    /* ===== Confetti particles ===== */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 199;
      width: 8px; height: 8px;
      border-radius: 2px;
      animation: confettiFall var(--duration) ease-in forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    /* ===== Coin sound wave ===== */
    .sound-wave {
      position: absolute;
      top: 50%; left: 50%;
      width: 40px; height: 40px;
      margin-left: -20px; margin-top: -20px;
      border-radius: 50%;
      border: 2px solid #C8974A;
      animation: soundWave 2.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes soundWave {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }
    /* ===== Big Red Heart Effect (TikTok Style) ===== */
    .big-heart {
      position: fixed;
      pointer-events: none;
      z-index: 250;
      font-size: 120px;
      animation: heartExplode 6.0s ease-out forwards;
      filter: drop-shadow(0 0 30px rgba(255, 50, 50, 0.6));
    }
    @keyframes heartExplode {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      10% { transform: scale(1.8) rotate(15deg); opacity: 1; }
      25% { transform: scale(0.8) rotate(-8deg); opacity: 1; }
      40% { transform: scale(1.3) rotate(5deg); opacity: 1; }
      60% { transform: scale(0.95) rotate(-2deg); opacity: 1; }
      80% { transform: scale(1.05) rotate(1deg); opacity: 0.8; }
      100% { transform: scale(1.15) rotate(0deg) scale(1); opacity: 0; }
    }
    /* ===== Small floating hearts ===== */
    .mini-heart {
      position: fixed;
      pointer-events: none;
      z-index: 251;
      animation: heartFloat var(--dur) ease-out forwards;
    }
    @keyframes heartFloat {
      0% { transform: translate(0,0) scale(0); opacity: 1; }
      30% { transform: translate(var(--x), var(--y)) scale(1.2); opacity: 1; }
      100% { transform: translate(calc(var(--x)*2), calc(var(--y)*2)) scale(0.3); opacity: 0; }
    }
    /* ===== Screen shake ===== */
    .shake-screen {
      animation: screenShake 0.3s ease-out;
    }
    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-4px, 2px); }
      40% { transform: translate(4px, -2px); }
      60% { transform: translate(-2px, 4px); }
      100% { transform: translate(2px, -4px); }
    }
    /* ===== Responsive ===== */
    @media (max-width: 420px) {
      #app { padding: 16px 12px 24px; }
      .bamboo-container { width: 160px; height: 224px; }
      .total-display .amount { font-size: 30px; }
      .aphorism-card .quote { font-size: 15px; }
    }
  </style>
  <script type="module" crossorigin src="/tzuchi-bamboo-bank/assets/index-CBTX2RZF.js"></script>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <!-- 慈濟 Logo（無文字） + 組織名稱 -->
    <img class="tzuchi-logo" src="/tzuchi-bamboo-bank/tzuchi-logo.jpg" alt="慈濟加東分會" />
    <div class="org-name">慈濟加東分會</div>
    <div class="greeting" id="greeting">早安，菩薩早安</div>
    <div class="date-display" id="dateDisplay">—</div>
  </div>

  <!-- Jing Si Aphorism -->
  <div class="aphorism-card">
    <div class="label">✦ 靜思語</div>
    <div class="divider"></div>
    <div class="quote" id="aphorismText">—</div>
    <div class="author">—— 證嚴法師《靜思語》</div>
  </div>

  <!-- Daily Missions -->
  <div class="mission-section">
    <div class="mission-row">
      <div class="icon">🌱</div>
      <div class="text">
        <span class="label">今日好事</span>
        <span id="goodDeed">—</span>
      </div>
    </div>
    <div class="mission-row">
      <div class="icon heart">💛</div>
      <div class="text">
        <span class="label">今日好話</span>
        <span id="goodWord">—</span>
      </div>
    </div>
  </div>

  <!-- Bamboo Bank -->
  <div class="bamboo-section">
    <div class="title">🎋 竹筒歲月．點滴成愛</div>
    <div class="bamboo-container" id="bambooContainer">
      <svg class="bamboo-svg" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Shadow -->
        <ellipse cx="100" cy="290" rx="55" ry="7" fill="#3A2E20" opacity="0.10"/>
        
        <defs>
          <!-- 罐身綠色漸層 (Cylinder green gradient) -->
          <linearGradient id="canBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3A7A2A"/>
            <stop offset="12%" stop-color="#5AA03A"/>
            <stop offset="30%" stop-color="#6DB848"/>
            <stop offset="50%" stop-color="#78C450"/>
            <stop offset="65%" stop-color="#6DB848"/>
            <stop offset="80%" stop-color="#4E9030"/>
            <stop offset="100%" stop-color="#2D6A1E"/>
          </linearGradient>
          <!-- 銀色蓋子漸層 (Silver lid gradient) -->
          <linearGradient id="silverLid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E8E8E8"/>
            <stop offset="25%" stop-color="#F8F8F8"/>
            <stop offset="50%" stop-color="#D0D0D0"/>
            <stop offset="75%" stop-color="#B8B8B8"/>
            <stop offset="100%" stop-color="#A0A0A0"/>
          </linearGradient>
          <!-- 蓋子頂面 -->  
          <linearGradient id="lidTop" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#C0C0C0"/>
            <stop offset="30%" stop-color="#E8E8E8"/>
            <stop offset="60%" stop-color="#D0D0D0"/>
            <stop offset="100%" stop-color="#B0B0B0"/>
          </linearGradient>
          <!-- 金色錢幣 -->
          <radialGradient id="goldCoin" cx="50%" cy="40%" r="50%">
            <stop offset="0%" stop-color="#FFE44D"/>
            <stop offset="50%" stop-color="#E8B830"/>
            <stop offset="100%" stop-color="#C89720"/>
          </radialGradient>
          <clipPath id="canMain">
            <rect x="40" y="55" width="120" height="225" rx="6"/>
          </clipPath>
        </defs>

        <!-- ===== 銀色金屬蓋子 (Silver Lid) ===== -->
        <!-- 蓋子側面 -->
        <rect x="36" y="20" width="128" height="22" rx="3" fill="url(#silverLid)" stroke="#909090" stroke-width="0.5"/>
        <!-- 蓋子頂面（橢圓） -->
        <ellipse cx="100" cy="22" rx="64" ry="8" fill="url(#lidTop)" stroke="#A0A0A0" stroke-width="0.5"/>
        <!-- 蓋子光澤 -->
        <ellipse cx="90" cy="20" rx="40" ry="4" fill="white" opacity="0.15"/>
        <!-- 蓋子底部邊緣 -->
        <rect x="36" y="38" width="128" height="3" rx="1" fill="#808080" opacity="0.5"/>

        <!-- ===== 投幣口 (Coin Slot on Lid) ===== -->
        <rect x="88" y="16" width="24" height="6" rx="2" fill="#1A1008"/>
        <rect x="90" y="17" width="20" height="4" rx="1.5" fill="#0A0604"/>
        <ellipse cx="100" cy="15" rx="12" ry="2" fill="#1A1008" opacity="0.3"/>

        <!-- ===== 金色錢幣在蓋子上方 (Gold Coin on Top) ===== -->
        <g transform="translate(130, 12)">
          <ellipse cx="0" cy="0" rx="13" ry="10" fill="url(#goldCoin)" stroke="#B88620" stroke-width="0.8"/>
          <ellipse cx="-1" cy="-1" rx="9" ry="7" fill="none" stroke="#FFE88A" stroke-width="0.5" opacity="0.4"/>
          <ellipse cx="0" cy="0" rx="11" ry="8" fill="none" stroke="#A07818" stroke-width="0.5" opacity="0.3"/>
          <!-- $ 符號 -->
          <text x="0" y="4" text-anchor="middle" fill="#A07818" font-size="11" font-weight="bold" font-family="Arial">$</text>
          <!-- 金幣光澤 -->
          <ellipse cx="-4" cy="-3" rx="4" ry="2" fill="white" opacity="0.3" transform="rotate(-20)"/>
        </g>

        <!-- ===== 綠色罐身 (Green Can Body) ===== -->
        <rect x="40" y="42" width="120" height="238" rx="4" fill="url(#canBody)" stroke="#2D6A1E" stroke-width="0.8"/>

        <!-- ===== 罐身明暗立體感 ===== -->
        <g clip-path="url(#canMain)" opacity="0.15">
          <rect x="40" y="55" width="20" height="225" fill="white"/>
          <rect x="130" y="55" width="30" height="225" fill="black"/>
        </g>

        <!-- ===== 竹紋印刷 (Printed Bamboo Pattern) ===== -->
        <!-- 竹竿 -->
        <g clip-path="url(#canMain)" opacity="0.25">
          <!-- 左竹竿 -->
          <rect x="52" y="55" width="14" height="225" rx="7" fill="none" stroke="#2D6A1E" stroke-width="2"/>
          <rect x="52" y="55" width="14" height="225" rx="7" fill="none" stroke="#4E9030" stroke-width="1" opacity="0.5"/>
          <!-- 中竹竿 -->
          <rect x="92" y="55" width="16" height="225" rx="8" fill="none" stroke="#2D6A1E" stroke-width="2.5"/>
          <rect x="92" y="55" width="16" height="225" rx="8" fill="none" stroke="#4E9030" stroke-width="1" opacity="0.5"/>
          <!-- 右竹竿 -->
          <rect x="136" y="55" width="12" height="225" rx="6" fill="none" stroke="#2D6A1E" stroke-width="2"/>
          <!-- 竹葉 (Bamboo leaves) -->
          <path d="M60 90 Q48 78 44 88 Q50 92 60 90Z" fill="#2D6A1E" opacity="0.6"/>
          <path d="M65 100 Q52 90 48 100 Q54 104 65 100Z" fill="#3A7A2A" opacity="0.5"/>
          <path d="M105 75 Q118 65 122 75 Q116 78 105 75Z" fill="#2D6A1E" opacity="0.6"/>
          <path d="M100 85 Q112 75 116 85 Q110 88 100 85Z" fill="#3A7A2A" opacity="0.5"/>
          <path d="M58 160 Q45 150 42 160 Q48 163 58 160Z" fill="#2D6A1E" opacity="0.5"/>
          <path d="M140 130 Q152 120 155 130 Q150 133 140 130Z" fill="#2D6A1E" opacity="0.5"/>
          <path d="M98 150 Q110 140 114 150 Q108 153 98 150Z" fill="#3A7A2A" opacity="0.4"/>
        </g>

        <!-- ===== 白色文字 (White Text on Can) ===== -->
        <!-- 「竹筒歲月」主標題 -->
        <text x="100" y="180" text-anchor="middle" fill="white" font-size="22" font-weight="700" opacity="0.95" font-family="'Noto Sans TC','KaiTi','STKaiti',serif" letter-spacing="4" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.4))">竹筒歲月</text>
        
        <!-- Bamboo Bank Era 英文 -->
        <text x="100" y="206" text-anchor="middle" fill="white" font-size="10" font-weight="400" opacity="0.85" font-family="Arial,sans-serif" letter-spacing="2" filter="drop-shadow(0 1px 1px rgba(0,0,0,0.3))">Bamboo Bank Era</text>

        <!-- ===== 上緣銀環 ===== -->
        <rect x="38" y="42" width="124" height="3" rx="1.5" fill="#A0A0A0" opacity="0.6"/>

        <!-- ===== 底部 ===== -->
        <rect x="38" y="275" width="124" height="3" rx="1.5" fill="#2D5A1A" opacity="0.6"/>
        <ellipse cx="100" cy="278" rx="58" ry="4" fill="#1A4A0E" opacity="0.15"/>

        <!-- ===== Tzu Chi 小蓮花 Logo ===== -->
        <g transform="translate(100, 76)" opacity="0.5">
          <path d="M0 -6 Q-4 -12 -2 -9 Q-1 -7 0 -6Z" fill="white"/>
          <path d="M0 -6 Q4 -12 2 -9 Q1 -7 0 -6Z" fill="white"/>
          <circle cx="0" cy="-6" r="1.5" fill="#C8974A"/>
        </g>

        <!-- ===== 內部錢幣 ===== -->
        <g id="coinStack" opacity="0" clip-path="url(#canMain)">
          <circle cx="90" cy="252" r="6" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="100" cy="254" r="6" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="110" cy="250" r="6" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="95" cy="258" r="6" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="105" cy="260" r="6" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
        </g>
      </svg>

      <!-- Coin drop ripple overlay -->
      <div class="ripple" id="rippleEffect" style="display:none;"></div>
    </div>

    <!-- Total amount -->
    <div class="total-display">
      <div class="amount"><span id="totalAmount">0</span><span class="unit">元</span></div>
      <div class="sub" id="todayCount">今日已投入 0 元</div>
    </div>
  </div>

  <!-- ===== Applause Overlay ===== -->
  <div class="applause-overlay" id="applauseOverlay">
    <div class="hands">👏</div>
    <div class="text">功德無量！</div>
    <div class="sub-text">善根增長．福慧雙修</div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="lbl">連續天數</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statDays">0</div>
      <div class="lbl">投入天數</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="lbl">目前總額</div>
    </div>
  </div>
  <div style="width:100%;text-align:center;margin-top:0;padding:4px 0 8px;">
    <span style="font-size:11px;color:#A09070;letter-spacing:1px;">🕯️ 累計總額</span>
    <span style="font-size:16px;font-weight:600;color:#5A4E3A;margin-left:6px;" id="statLifetime">0</span>
    <span style="font-size:11px;color:#A09070;">元</span>
  </div>

  <!-- Drop button -->
  <button class="drop-btn" id="dropBtn">投入一元 💰</button>

  <!-- Reset button -->
  <button class="reset-btn" id="resetBtn">🔄 重置竹筒（保留歷史紀錄）</button>

  <!-- History -->
  <div class="history-section">
    <button class="toggle-btn" id="historyToggle">📋 查看投入紀錄</button>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<!-- ===== Reset Confirmation Modal ===== -->
<div class="modal-overlay" id="resetModal">
  <div class="modal-box">
    <div class="modal-icon">🔄</div>
    <div class="modal-title">重置竹筒撲滿</div>
    <div class="modal-text">竹筒內的錢幣將會清空歸零，<br/>但所有歷史紀錄會保留。<br/>確定要重置嗎？</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" id="modalCancel">取消</button>
      <button class="modal-btn confirm" id="modalConfirm">確定重置</button>
    </div>
  </div>
</div>

</body>
</html>
