<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>竹筒歲月 — 每日一善</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    /* ===== Google Fonts ===== */
    /* ===== 全域重設 ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100vh;
      font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #F5F0E8;
      color: #3A2E20;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* ===== App Container ===== */
    #app {
      max-width: 420px;
      margin: 0 auto;
      padding: 20px 16px 30px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    /* ===== Header ===== */
    .header {
      width: 100%;
      text-align: center;
      padding: 12px 0 6px;
      position: relative;
    }
    .header .greeting {
      font-size: 15px;
      color: #8B7355;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }
    .header .date-display {
      font-size: 12px;
      color: #A09070;
      letter-spacing: 0.5px;
    }
    .header .tzuchi-logo {
      width: 44px; height: 44px;
      margin: 0 auto 8px;
      display: block;
    }
    /* ===== Jing Si Aphorism Card ===== */
    .aphorism-card {
      width: 100%;
      background: linear-gradient(135deg, #FFFFFF 0%, #FCF8F0 100%);
      border-radius: 16px;
      padding: 20px 18px;
      margin: 12px 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid rgba(196, 176, 140, 0.2);
      position: relative;
      text-align: center;
    }
    .aphorism-card .label {
      font-size: 11px;
      color: #C8974A;
      letter-spacing: 2px;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .aphorism-card .quote {
      font-size: 17px;
      line-height: 1.7;
      color: #3A2E20;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .aphorism-card .author {
      font-size: 12px;
      color: #A09070;
      margin-top: 10px;
      letter-spacing: 1px;
    }
    .aphorism-card .divider {
      width: 40px; height: 2px;
      background: #D4A76A;
      margin: 10px auto 12px;
      border-radius: 2px;
      opacity: 0.5;
    }
    /* ===== Daily Mission ===== */
    .mission-section {
      width: 100%;
      margin: 8px 0;
    }
    .mission-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(196, 176, 140, 0.12);
    }
    .mission-row .icon {
      font-size: 22px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #9BC53D, #7FA832);
      border-radius: 50%;
      flex-shrink: 0;
      color: white;
      font-size: 16px;
    }
    .mission-row .icon.heart { background: linear-gradient(135deg, #E88D67, #D4754F); }
    .mission-row .icon.lotus { background: linear-gradient(135deg, #C8974A, #B8863A); }
    .mission-row .text {
      flex: 1;
      font-size: 14px;
      line-height: 1.5;
      color: #3A2E20;
    }
    .mission-row .text .label {
      font-size: 10px;
      color: #A09070;
      letter-spacing: 1px;
      display: block;
      margin-bottom: 2px;
    }
    /* ===== Bamboo Bank ===== */
    .bamboo-section {
      width: 100%;
      text-align: center;
      margin: 16px 0 8px;
      position: relative;
    }
    .bamboo-section .title {
      font-size: 13px;
      color: #8B7355;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    .bamboo-container {
      position: relative;
      width: 200px;
      height: 280px;
      margin: 0 auto;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .bamboo-container:active {
      transform: scale(0.97);
      transition: transform 0.1s;
    }
    /* ===== Bamboo SVG ===== */
    .bamboo-svg {
      width: 100%; height: 100%;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.12));
    }
    /* ===== Coin Drop Animation ===== */
    .coin-fly {
      position: fixed;
      width: 36px; height: 36px;
      pointer-events: none;
      z-index: 100;
      font-size: 30px;
      line-height: 36px;
      text-align: center;
      animation: coinDrop 0.8s ease-in forwards;
    }
    @keyframes coinDrop {
      0% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
      60% { opacity: 1; transform: translateY(120px) scale(1.1) rotate(360deg); }
      100% { opacity: 0; transform: translateY(180px) scale(0.6) rotate(720deg); }
    }
    /* ===== Clink Ripple ===== */
    .ripple {
      position: absolute;
      top: 55%; left: 50%;
      width: 60px; height: 30px;
      margin-left: -30px; margin-top: -15px;
      border-radius: 50%;
      border: 2px solid #C8974A;
      opacity: 0;
      pointer-events: none;
      animation: rippleAnim 0.6s ease-out forwards;
    }
    @keyframes rippleAnim {
      0% { transform: scale(0.3); opacity: 0.8; }
      100% { transform: scale(2); opacity: 0; }
    }
    /* ===== Total Display ===== */
    .total-display {
      margin: 8px 0 4px;
      text-align: center;
    }
    .total-display .amount {
      font-size: 36px;
      font-weight: 700;
      color: #3A2E20;
      letter-spacing: 1px;
      line-height: 1.2;
    }
    .total-display .amount .unit {
      font-size: 16px;
      font-weight: 400;
      color: #8B7355;
      margin-left: 2px;
    }
    .total-display .sub {
      font-size: 12px;
      color: #A09070;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    /* ===== Stats ===== */
    .stats-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }
    .stat-card {
      background: rgba(255,255,255,0.7);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      border: 1px solid rgba(196, 176, 140, 0.12);
    }
    .stat-card .num {
      font-size: 22px;
      font-weight: 600;
      color: #3A2E20;
    }
    .stat-card .lbl {
      font-size: 10px;
      color: #A09070;
      letter-spacing: 1px;
      margin-top: 2px;
    }
    /* ===== Drop Button ===== */
    .drop-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #9BC53D 0%, #7FA832 100%);
      color: white;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 12px rgba(155, 197, 61, 0.3);
    }
    .drop-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 6px rgba(155, 197, 61, 0.2);
    }
    .drop-btn:disabled {
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }
    /* ===== History ===== */
    .history-section {
      width: 100%;
      margin-top: 16px;
    }
    .history-section .toggle-btn {
      width: 100%;
      background: none;
      border: none;
      font-size: 13px;
      color: #8B7355;
      cursor: pointer;
      padding: 8px;
      letter-spacing: 1px;
      font-family: inherit;
    }
    .history-section .toggle-btn:hover { color: #3A2E20; }
    .history-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }
    .history-list.open { max-height: 400px; overflow-y: auto; }
    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(196, 176, 140, 0.1);
      font-size: 13px;
      color: #5A4E3A;
    }
    .history-item .date { color: #A09070; }
    .history-item .count { font-weight: 500; }
    /* ===== Sparkle effect ===== */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      animation: sparkleAnim 0.8s ease-out forwards;
    }
    @keyframes sparkleAnim {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }
    /* ===== Applause overlay ===== */
    .applause-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .applause-overlay.show { opacity: 1; }
    .applause-overlay .hands {
      font-size: 60px;
      animation: clapAnim 0.5s ease-in-out infinite alternate;
    }
    @keyframes clapAnim {
      0% { transform: scale(1) rotate(-15deg); }
      100% { transform: scale(1.2) rotate(15deg); }
    }
    .applause-overlay .text {
      font-size: 20px;
      color: #9BC53D;
      font-weight: 500;
      letter-spacing: 3px;
      margin-top: 12px;
      text-shadow: 0 2px 8px rgba(155, 197, 61, 0.3);
      animation: textPop 0.5s ease-out;
    }
    @keyframes textPop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .applause-overlay .sub-text {
      font-size: 13px;
      color: #A09070;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    /* ===== Confetti particles ===== */
    .confetti {
      position: fixed;
      pointer-events: none;
      z-index: 199;
      width: 8px; height: 8px;
      border-radius: 2px;
      animation: confettiFall var(--duration) ease-in forwards;
    }
    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    /* ===== Coin sound wave ===== */
    .sound-wave {
      position: absolute;
      top: 50%; left: 50%;
      width: 40px; height: 40px;
      margin-left: -20px; margin-top: -20px;
      border-radius: 50%;
      border: 2px solid #C8974A;
      animation: soundWave 0.5s ease-out forwards;
      pointer-events: none;
    }
    @keyframes soundWave {
      0% { transform: scale(0.5); opacity: 0.8; }
      100% { transform: scale(3); opacity: 0; }
    }
    /* ===== Responsive ===== */
    @media (max-width: 420px) {
      #app { padding: 16px 12px 24px; }
      .bamboo-container { width: 160px; height: 224px; }
      .total-display .amount { font-size: 30px; }
      .aphorism-card .quote { font-size: 15px; }
    }
  </style>
  <script type="module" crossorigin src="/tzuchi-bamboo-bank/assets/index-BBU1IRw6.js"></script>
</head>
<body>

<div id="app">
  <!-- Header -->
  <div class="header">
    <svg class="tzuchi-logo" viewBox="0 0 100 100" fill="none">
      <!-- Simplified Tzu Chi lotus logo -->
      <circle cx="50" cy="50" r="46" fill="#9BC53D" opacity="0.12"/>
      <path d="M50 20 Q35 40 30 55 Q25 70 30 75 Q35 80 50 75 Q65 80 70 75 Q75 70 70 55 Q65 40 50 20Z" fill="#9BC53D" opacity="0.7"/>
      <path d="M50 28 Q42 42 38 52 Q34 62 38 65 Q42 68 50 64 Q58 68 62 65 Q66 62 62 52 Q58 42 50 28Z" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="50" cy="48" r="6" fill="#C8974A" opacity="0.6"/>
    </svg>
    <div class="greeting" id="greeting">早安，菩薩早安</div>
    <div class="date-display" id="dateDisplay">—</div>
  </div>

  <!-- Jing Si Aphorism -->
  <div class="aphorism-card">
    <div class="label">✦ 靜思語</div>
    <div class="divider"></div>
    <div class="quote" id="aphorismText">—</div>
    <div class="author">—— 證嚴法師《靜思語》</div>
  </div>

  <!-- Daily Missions -->
  <div class="mission-section">
    <div class="mission-row">
      <div class="icon">🌱</div>
      <div class="text">
        <span class="label">今日好事</span>
        <span id="goodDeed">—</span>
      </div>
    </div>
    <div class="mission-row">
      <div class="icon heart">💛</div>
      <div class="text">
        <span class="label">今日好話</span>
        <span id="goodWord">—</span>
      </div>
    </div>
  </div>

  <!-- Bamboo Bank -->
  <div class="bamboo-section">
    <div class="title">🎋 竹筒歲月．點滴成愛</div>
    <div class="bamboo-container" id="bambooContainer">
      <svg class="bamboo-svg" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Shadow -->
        <ellipse cx="100" cy="290" rx="55" ry="7" fill="#3A2E20" opacity="0.10"/>
        
        <defs>
          <!-- 竹身主漸層：自然的竹黃色 -->
          <linearGradient id="bambooBody" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#B8955A"/>
            <stop offset="8%" stop-color="#C8A870"/>
            <stop offset="18%" stop-color="#DEC898"/>
            <stop offset="30%" stop-color="#E8D4A8"/>
            <stop offset="45%" stop-color="#EAD8B0"/>
            <stop offset="55%" stop-color="#E5CFA0"/>
            <stop offset="70%" stop-color="#DCC490"/>
            <stop offset="85%" stop-color="#C8A870"/>
            <stop offset="100%" stop-color="#B08850"/>
          </linearGradient>
          <!-- 斜面切口漸層 -->
          <linearGradient id="cutTop" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#EDD8B0"/>
            <stop offset="50%" stop-color="#DCC48A"/>
            <stop offset="100%" stop-color="#B89058"/>
          </linearGradient>
          <!-- 內部陰影 -->
          <linearGradient id="innerShadow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5A4A30"/>
            <stop offset="100%" stop-color="#2A2010"/>
          </linearGradient>
          <!-- 紅緞帶 -->
          <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#E84040"/>
            <stop offset="40%" stop-color="#D43030"/>
            <stop offset="100%" stop-color="#B02020"/>
          </linearGradient>
          <clipPath id="bambooMain">
            <rect x="50" y="25" width="100" height="250" rx="4"/>
          </clipPath>
        </defs>

        <!-- ===== 竹身本體 ===== -->
        <!-- 主體 -->
        <rect x="50" y="25" width="100" height="250" rx="4" fill="url(#bambooBody)" stroke="#A07840" stroke-width="0.8"/>

        <!-- 竹節 (Bamboo nodes - raised rings) -->
        <g clip-path="url(#bambooMain)" opacity="0.5">
          <!-- 每個節：深色環帶 + 亮邊 -->
          <g>
            <rect x="48" y="55" width="104" height="4" rx="1" fill="#A0804A" opacity="0.6"/>
            <rect x="48" y="55" width="104" height="1" fill="#E8D4A0" opacity="0.4"/>
          </g>
          <g>
            <rect x="48" y="95" width="104" height="4" rx="1" fill="#A0804A" opacity="0.6"/>
            <rect x="48" y="95" width="104" height="1" fill="#E8D4A0" opacity="0.4"/>
          </g>
          <g>
            <rect x="48" y="135" width="104" height="4" rx="1" fill="#A0804A" opacity="0.6"/>
            <rect x="48" y="135" width="104" height="1" fill="#E8D4A0" opacity="0.4"/>
          </g>
          <g>
            <rect x="48" y="175" width="104" height="4" rx="1" fill="#A0804A" opacity="0.6"/>
            <rect x="48" y="175" width="104" height="1" fill="#E8D4A0" opacity="0.4"/>
          </g>
          <g>
            <rect x="48" y="215" width="104" height="4" rx="1" fill="#A0804A" opacity="0.5"/>
            <rect x="48" y="215" width="104" height="1" fill="#E8D4A0" opacity="0.3"/>
          </g>
        </g>

        <!-- 竹紋 (Bamboo grain texture) -->
        <g clip-path="url(#bambooMain)" opacity="0.07">
          <line x1="62" y1="25" x2="62" y2="275" stroke="#5A4A30" stroke-width="0.6"/>
          <line x1="75" y1="25" x2="75" y2="275" stroke="#5A4A30" stroke-width="0.4"/>
          <line x1="85" y1="25" x2="85" y2="275" stroke="#5A4A30" stroke-width="0.3"/>
          <line x1="95" y1="25" x2="95" y2="275" stroke="#5A4A30" stroke-width="0.4"/>
          <line x1="107" y1="25" x2="107" y2="275" stroke="#5A4A30" stroke-width="0.3"/>
          <line x1="120" y1="25" x2="120" y2="275" stroke="#5A4A30" stroke-width="0.5"/>
          <line x1="133" y1="25" x2="133" y2="275" stroke="#5A4A30" stroke-width="0.4"/>
          <line x1="142" y1="25" x2="142" y2="275" stroke="#5A4A30" stroke-width="0.5"/>
        </g>

        <!-- 竹身明暗立體感 (Light/shadow for 3D effect) -->
        <g clip-path="url(#bambooMain)" opacity="0.12">
          <rect x="50" y="25" width="18" height="250" fill="white"/>
          <rect x="122" y="25" width="28" height="250" fill="black"/>
        </g>

        <!-- ===== 頂部斜切口 ===== -->
        <!-- 真實的竹筒撲滿是斜切開口的 -->
        <path d="M50 28 L150 25 L150 35 L50 38 Z" fill="url(#cutTop)" stroke="#A07840" stroke-width="0.5"/>
        <!-- 切口內緣 -->
        <path d="M54 32 L146 29 L146 33 L54 36 Z" fill="#3A2A15" opacity="0.6"/>

        <!-- ===== 投幣口 (Coin slot on the cut surface) ===== -->
        <ellipse cx="100" cy="33" rx="14" ry="4" fill="#1A1008" opacity="0.9"/>
        <ellipse cx="100" cy="33" rx="12" ry="3" fill="#0A0804"/>
        <!-- Slot highlight -->
        <ellipse cx="100" cy="31" rx="10" ry="1.5" fill="#2A2010" opacity="0.4"/>

        <!-- ===== 上緣裝飾環 ===== -->
        <rect x="48" y="38" width="104" height="2" rx="1" fill="#A07840" opacity="0.4"/>

        <!-- ===== 底部 ===== -->
        <rect x="48" y="270" width="104" height="3" rx="1.5" fill="#8A6830" opacity="0.6"/>
        <ellipse cx="100" cy="273" rx="50" ry="3" fill="#7A5828" opacity="0.2"/>

        <!-- ===== 紅色緞帶 (Red Ribbon) ===== -->
        <!-- 上緞帶 -->
        <path d="M50 138 L50 152 Q50 156 54 156 L82 156 Q86 156 86 152 L86 138 Q86 134 82 134 L54 134 Q50 134 50 138Z" fill="url(#ribbonGrad)"/>
        <!-- 緞帶光澤 -->
        <path d="M52 140 L52 150 Q52 153 55 153 L68 153 L68 136 L55 136 Q52 136 52 140Z" fill="white" opacity="0.1"/>
        <!-- 下緞帶 -->
        <path d="M50 152 Q50 156 53 158 L80 158 Q83 156 84 152 L84 158 Q84 162 80 162 L53 162 Q50 162 50 158Z" fill="#B02020" opacity="0.5"/>

        <!-- ===== 蝴蝶結 (Bow knot) ===== -->
        <!-- 中心結 -->
        <circle cx="83" cy="147" r="7" fill="#D43030"/>
        <circle cx="83" cy="147" r="4" fill="#E04040"/>
        <!-- 左耳 -->
        <path d="M76 147 Q65 138 68 148 Q65 155 76 147Z" fill="#D43030"/>
        <path d="M75 147 Q68 141 70 148 Q68 152 75 147Z" fill="#E04040" opacity="0.6"/>
        <!-- 右耳 -->
        <path d="M90 147 Q101 138 98 148 Q101 155 90 147Z" fill="#D43030"/>
        <path d="M91 147 Q98 141 96 148 Q98 152 91 147Z" fill="#E04040" opacity="0.6"/>
        <!-- 緞帶尾 -->
        <path d="M83 154 Q78 168 75 178" stroke="#B02020" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
        <path d="M83 154 Q90 169 93 179" stroke="#D43030" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
        <!-- 尾端小三角 -->
        <path d="M74 178 L72 183 L78 180Z" fill="#B02020" opacity="0.7"/>
        <path d="M94 179 L92 184 L97 182Z" fill="#D43030" opacity="0.7"/>

        <!-- ===== 慈濟蓮花 Logo (手繪風格) ===== -->
        <g transform="translate(100, 92)" opacity="0.75">
          <!-- 蓮花花瓣 -->
          <path d="M0 -6 Q-5 -14 -3 -10 Q-2 -8 0 -6Z" fill="#9BC53D" opacity="0.7"/>
          <path d="M0 -6 Q5 -14 3 -10 Q2 -8 0 -6Z" fill="#9BC53D" opacity="0.7"/>
          <!-- 花心 -->
          <circle cx="0" cy="-6" r="1.5" fill="#C8974A"/>
        </g>

        <!-- ===== 「竹筒歲月」書法字 ===== -->
        <text x="100" y="200" text-anchor="middle" fill="#3A2E20" font-size="13" font-weight="500" opacity="0.8" font-family="'Noto Sans TC','KaiTi','STKaiti',serif" letter-spacing="3">竹筒歲月</text>
        <text x="100" y="218" text-anchor="middle" fill="#5A4E3A" font-size="9" opacity="0.55" font-family="'Noto Sans TC',sans-serif" letter-spacing="1.5">點滴聚大愛</text>

        <!-- ===== 右下方裝飾小蓮花 ===== -->
        <g transform="translate(145, 245)" opacity="0.25">
          <path d="M0 -3 Q-2.5 -7 -1.5 -5 Q-1 -4 0 -3Z" fill="#9BC53D"/>
          <path d="M0 -3 Q2.5 -7 1.5 -5 Q1 -4 0 -3Z" fill="#9BC53D"/>
          <circle cx="0" cy="-3" r="0.8" fill="#C8974A"/>
        </g>

        <!-- ===== 內部錢幣 (顯示累積金額) ===== -->
        <g id="coinStack" opacity="0" clip-path="url(#bambooMain)">
          <!-- 動態由 JavaScript 控制顯示 -->
          <circle cx="95" cy="248" r="7" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="95" cy="248" r="5" fill="#F0C840" opacity="0.6"/>
          <circle cx="105" cy="250" r="7" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="105" cy="250" r="5" fill="#F0C840" opacity="0.6"/>
          <circle cx="100" cy="253" r="7" fill="#E8B830" stroke="#C8974A" stroke-width="0.5"/>
          <circle cx="100" cy="253" r="5" fill="#F0C840" opacity="0.6"/>
        </g>
      </svg>

      <!-- Coin drop ripple overlay -->
      <div class="ripple" id="rippleEffect" style="display:none;"></div>
    </div>

    <!-- Total amount -->
    <div class="total-display">
      <div class="amount"><span id="totalAmount">0</span><span class="unit">元</span></div>
      <div class="sub" id="todayCount">今日已投入 0 元</div>
    </div>
  </div>

  <!-- ===== Applause Overlay ===== -->
  <div class="applause-overlay" id="applauseOverlay">
    <div class="hands">👏</div>
    <div class="text">功德無量！</div>
    <div class="sub-text">善根增長．福慧雙修</div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="num" id="statStreak">0</div>
      <div class="lbl">連續天數</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statDays">0</div>
      <div class="lbl">累積天數</div>
    </div>
    <div class="stat-card">
      <div class="num" id="statTotal">0</div>
      <div class="lbl">總金額</div>
    </div>
  </div>

  <!-- Drop button -->
  <button class="drop-btn" id="dropBtn">投入一元 💰</button>

  <!-- History -->
  <div class="history-section">
    <button class="toggle-btn" id="historyToggle">📋 查看投入紀錄</button>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

</body>
</html>
